<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a300faa091d8ca0f115049e/6ba663298_IMG_3469.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA / Add to Home Screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Members Lounge" />
    <link rel="apple-touch-icon" href="https://media.base44.com/images/public/6a300faa091d8ca0f115049e/6ba663298_IMG_3469.jpeg" />

    <title>My Booking — The Members Lounge</title>
    <meta name="description" content="Manage your event booking at The Members Lounge." />
    <meta name="theme-color" content="#0d0c0b" />

    <meta property="og:title" content="My Booking — The Members Lounge" />
    <meta property="og:description" content="Tap to manage your event booking." />
  </head>
  <body>
    <div id="root">
      <!-- Inline loading screen — shows instantly before the JS bundle loads.
           React replaces this content when it mounts. -->
      <div id="initial-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fdfcf8;font-family:-apple-system,system-ui,sans-serif;gap:16px;z-index:9999">
        <div style="width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#1e3a5f;border-radius:50%;animation:tml-spin 0.8s linear infinite"></div>
        <p style="font-size:14px;color:#64748b;font-weight:500;margin:0">Loading…</p>
      </div>
      <style>#initial-loader{opacity:1;transition:opacity 0.2s}@keyframes tml-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
